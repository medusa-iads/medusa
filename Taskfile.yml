# https://taskfile.dev

version: "3"

vars:
  PROJECT_NAME: Medusa
  DCS_HARNESS_VERSION: 1.0.0
  ARTIFACT_NAME: medusa-thin.lua
  BUNDLED_ARTIFACT_NAME: medusa.lua
  BUILD_DIR: ./dist
  SCRIPT_DIR: ./scripts
  SOURCE_DIR: ./src
  STYLUA_BIN_CI: ./tools/stylua/stylua
  STYLUA_BIN_WIN: ./tools/stylua/stylua.exe
  SELENE_BIN: ./tools/selene/selene
  SELENE_BIN_WIN: ./tools/selene/selene.exe
  SELENE_BUNDLED_CONFIG: selene-bundled.toml
  SELENE_CONFIG: selene.toml
  LUAUNIT_BIN: ./tools/luaunit/luaunit.lua
  TEST_DIR: ./tests
  PYTHON_BIN: python

tasks:
  default:
    desc: "Show all available tasks"
    cmds:
      - task --list

  format:
    desc: "Format lua source code with Stylua"
    cmds:
      - cmd: "{{.STYLUA_BIN_CI}} src tests examples"
        platforms: [linux, darwin]
      - cmd: "{{.STYLUA_BIN_WIN}} src tests examples"
        platforms: [windows]

  format:ci:
    desc: "Check lua source code for formatting errors"
    cmds:
      - cmd: "chmod +x {{.STYLUA_BIN_CI}}"
        platforms: [linux, darwin]
      - cmd: "{{.STYLUA_BIN_CI}} --check src tests examples"
        platforms: [linux, darwin]
      - cmd: "{{.STYLUA_BIN_WIN}} --check src tests examples"
        platforms: [windows]

  coverage:
    desc: "Run coverage tests with luacov"
    cmds:
      - echo "Not implemented"

  lint:
    deps: [build]
    desc: "Run Selene on build artifacts"
    cmds:
      - task: lint:artifacts

  lint:artifacts:
    desc: "Run Selene on existing build artifacts"
    cmds:
      - task: lint:thin
      - task: lint:bundled

  lint:thin:
    desc: "Run Selene on the thin build artifact"
    cmds:
      - cmd: "{{.SELENE_BIN}} --allow-warnings --config {{.SELENE_CONFIG}} {{.BUILD_DIR}}/{{.ARTIFACT_NAME}}"
        platforms: [linux, darwin]
      - cmd: "{{.SELENE_BIN_WIN}} --allow-warnings --config {{.SELENE_CONFIG}} {{.BUILD_DIR}}/{{.ARTIFACT_NAME}}"
        platforms: [windows]

  lint:bundled:
    desc: "Run Selene on the bundled build artifact"
    cmds:
      - cmd: "{{.SELENE_BIN}} --allow-warnings --config {{.SELENE_BUNDLED_CONFIG}} {{.BUILD_DIR}}/{{.BUNDLED_ARTIFACT_NAME}}"
        platforms: [linux, darwin]
      - cmd: "{{.SELENE_BIN_WIN}} --allow-warnings --config {{.SELENE_BUNDLED_CONFIG}} {{.BUILD_DIR}}/{{.BUNDLED_ARTIFACT_NAME}}"
        platforms: [windows]

  syntax:check:
    desc: "Parse build artifacts with Lua 5.1"
    cmds:
      - 'luac -p "{{.BUILD_DIR}}/{{.ARTIFACT_NAME}}"'
      - 'luac -p "{{.BUILD_DIR}}/{{.BUNDLED_ARTIFACT_NAME}}"'

  test:
    desc: "Run tests with LuaUnit"
    cmds:
      - "lua {{.TEST_DIR}}/runner.lua {{.CLI_ARGS}}"
    sources:
      - "{{.SOURCE_DIR}}/**/*.lua"
      - "{{.TEST_DIR}}/**/*.lua"

  dependencies:update:dcs-harness:
    desc: "Update the vendored dcs-harness release"
    vars:
      DOWNLOAD_DIR: ./.task/dcs-harness
      ARCHIVE: "{{.DOWNLOAD_DIR}}/harness.zip"
      DEFINITION: "{{.DOWNLOAD_DIR}}/harness.d.lua"
    preconditions:
      - sh: command -v curl
        msg: "curl is required to update dcs-harness"
      - sh: command -v unzip
        msg: "unzip is required to update dcs-harness"
      - sh: command -v cp
        msg: "cp is required to update dcs-harness"
    cmds:
      - 'curl --fail --location --silent --show-error --create-dirs --output "{{.ARCHIVE}}" "https://github.com/YoloWingPixie/dcs-harness/releases/download/v{{.DCS_HARNESS_VERSION}}/harness.zip"'
      - 'unzip -o "{{.ARCHIVE}}" -d "{{.DOWNLOAD_DIR}}"'
      - 'curl --fail --location --silent --show-error --output "{{.DEFINITION}}" "https://raw.githubusercontent.com/YoloWingPixie/dcs-harness/v{{.DCS_HARNESS_VERSION}}/dist/harness.d.lua"'
      - 'cp "{{.DOWNLOAD_DIR}}/harness.lua" "{{.DEFINITION}}" dependencies/'
      - 'echo "Vendored dcs-harness {{.DCS_HARNESS_VERSION}}"'

  dependencies:lock:
    desc: "Update the Python dependency lockfile"
    preconditions:
      - sh: command -v uv
        msg: "uv 0.10.12 is required to update the dependency lockfile"
    cmds:
      - uv lock

  complexity:check:
    desc: "Report Lua complexity warnings"
    preconditions:
      - sh: command -v uv
        msg: "uv 0.10.12 is required to run complexity checks"
    cmds:
      - uv run --locked --only-group quality python scripts/ci/lua_complexity.py {{.SOURCE_DIR}} {{.CLI_ARGS}}

  ci:comment:test:
    desc: "Test CI pull request comment reporting"
    preconditions:
      - sh: command -v node
        msg: "Node.js is required to test CI pull request comment reporting"
    cmds:
      - node --test scripts/ci/comment_pr_results.test.js

  release:package:test:
    desc: "Test release artifact packaging"
    cmds:
      - '{{.PYTHON_BIN}} -m unittest discover -s {{.SCRIPT_DIR}}/build -p "test_*.py"'

  build:
    deps: [format, delete:artifact]
    desc: "Build the {{.PROJECT_NAME}} artifact"
    cmds:
      - "{{.PYTHON_BIN}} {{.SCRIPT_DIR}}/build/build_single_lua_release.py"
      - BUILD_DIR='{{.BUILD_DIR}}' ARTIFACT_NAME='{{.ARTIFACT_NAME}}' BUNDLED_ARTIFACT_NAME='{{.BUNDLED_ARTIFACT_NAME}}' '{{.PYTHON_BIN}}' '{{.SCRIPT_DIR}}/build/stamp-placeholders.py'
    sources:
      - "{{.SOURCE_DIR}}/**/*.lua"
      - "{{.SCRIPT_DIR}}/build/**/*.py"
      - ".buildrc"
    generates:
      - "{{.BUILD_DIR}}/{{.ARTIFACT_NAME}}"
      - "{{.BUILD_DIR}}/{{.BUNDLED_ARTIFACT_NAME}}"

  diagrams:build:
    desc: "Render documentation diagrams"
    preconditions:
      - sh: command -v d2
        msg: "D2 is required to render documentation diagrams"
    cmds:
      - for: sources
        cmd: 'd2 --layout=elk --pad=24 --omit-version "{{.ITEM}}" "{{trimSuffix ".d2" .ITEM}}.svg"'
    sources:
      - "docs/diagrams/**/*.d2"
    generates:
      - "docs/diagrams/**/*.svg"

  delete:artifact:
    desc: "Delete the build artifact"
    internal: true
    cmds:
      - cmd: powershell -NoProfile -Command "if (Test-Path -LiteralPath '{{.BUILD_DIR}}/{{.ARTIFACT_NAME}}') { Remove-Item -LiteralPath '{{.BUILD_DIR}}/{{.ARTIFACT_NAME}}' -Force }; if (Test-Path -LiteralPath '{{.BUILD_DIR}}/{{.BUNDLED_ARTIFACT_NAME}}') { Remove-Item -LiteralPath '{{.BUILD_DIR}}/{{.BUNDLED_ARTIFACT_NAME}}' -Force }; exit 0"
        platforms: [windows]
        ignore_error: true
      - cmd: rm -f "{{.BUILD_DIR}}/{{.ARTIFACT_NAME}}" "{{.BUILD_DIR}}/{{.BUNDLED_ARTIFACT_NAME}}"
        platforms: [linux, darwin]
        ignore_error: true

  ci:
    desc: "Run all CI checks"
    cmds:
      - task: format:ci
      - task: test
      - task: complexity:check
      - task: ci:comment:test
      - task: release:package:test
      - task: build
      - task: syntax:check
      - task: lint:artifacts
      - task: o11y:check

  ci:watch:
    deps: [ci]
    desc: "Run CI checks on file changes"
    watch: true
    sources:
      - "{{.SOURCE_DIR}}/**/*.lua"
      - "{{.TEST_DIR}}/**/*.lua"
      - "examples/**/*.lua"
      - "scripts/ci/**/*.py"
      - "scripts/ci/**/*.js"
      - "pyproject.toml"
      - "uv.lock"

  bump:
    desc: "Bump the project version"
    requires:
      vars:
        - name: PART
          enum: [major, minor, patch]
    cmds:
      - "{{.PYTHON_BIN}} {{.SCRIPT_DIR}}/build/bump_version.py {{.PART}}"
      - task: dependencies:lock

  bump:major:
    desc: "Bump the major version"
    cmds:
      - task: bump
        vars:
          PART: major

  bump:minor:
    desc: "Bump the minor version"
    cmds:
      - task: bump
        vars:
          PART: minor

  bump:patch:
    desc: "Bump the patch version"
    cmds:
      - task: bump
        vars:
          PART: patch

  analyze:
    desc: "Analyze a Medusa log file (usage: task analyze -- <logfile> <command> [--json])"
    cmds:
      - "{{.PYTHON_BIN}} tools/log-analyzer/analyze.py {{.CLI_ARGS}}"

  prometheus:
    desc: "Start local Prometheus + Grafana stack for Medusa metrics"
    dir: tools/prometheus
    cmds:
      - docker compose up -d

  o11y:check:
    desc: "Validate dashboards and tactical JavaScript"
    dir: tools/prometheus
    cmds:
      - '{{.PYTHON_BIN}} -c "import json, pathlib; [json.loads(pathlib.Path(p).read_text()) for p in pathlib.Path(''grafana/provisioning/dashboards'').glob(''*.json'')]"'
      - node --check tactical/js/utils.js
      - node --check tactical/js/render.js
      - node --check tactical/js/ui.js
      - node --check tactical/js/app.js
      - node tactical/js/render.test.js

  o11y:check:full:
    desc: "Validate Prometheus stack configuration, dashboards, and tactical JavaScript"
    dir: tools/prometheus
    cmds:
      - task: o11y:check
      - docker compose config --quiet
      - docker compose run --rm --no-deps --entrypoint promtool prometheus check config /etc/prometheus/prometheus.yml
      - docker compose run --rm --no-deps --entrypoint promtool prometheus check rules /etc/prometheus/rules.yml

  prometheus:restart:
    desc: "Restart Prometheus + Grafana stack"
    deps: [prometheus:stop]
    cmds:
      - task: prometheus

  tactical:restart:
    desc: "Restart tactical display container"
    dir: tools/prometheus
    cmds:
      - docker compose restart tactical

  grafana:restart:
    desc: "Restart Grafana container"
    dir: tools/prometheus
    cmds:
      - docker compose restart grafana

  prometheus:stop:
    desc: "Stop Prometheus + Grafana stack"
    dir: tools/prometheus
    cmds:
      - docker compose down

  prometheus:reset:
    desc: "Stop stack and blow out all Prometheus + Grafana volumes"
    dir: tools/prometheus
    cmds:
      - docker compose down -v

  tag:
    desc: "Create and push git tag from pyproject version"
    cmds:
      - "{{.PYTHON_BIN}} {{.SCRIPT_DIR}}/build/tag_version.py"
    silent: false

  release:package:
    deps: [build]
    desc: "Create release archives and checksums"
    cmds:
      - "{{.PYTHON_BIN}} {{.SCRIPT_DIR}}/build/prepare_release.py"

  retag:
    desc: "Delete current version tag locally and remotely, then re-tag HEAD"
    vars:
      TAG:
        sh: '{{.PYTHON_BIN}} -c "import re; from pathlib import Path; v=re.search(r''version\s*=\s*\"([\d.]+)\"'', Path(''pyproject.toml'').read_text()).group(1); print(f''v{v}'')"'
    cmds:
      - cmd: "git tag -d {{.TAG}}"
        ignore_error: true
      - cmd: "git push origin --delete {{.TAG}}"
        ignore_error: true
      - task: tag

  release:
    desc: "Full release: bump version, commit, tag, and push (usage: task release -- minor)"
    vars:
      PART: "{{.CLI_ARGS}}"
    requires:
      vars:
        - name: PART
          enum: [major, minor, patch]
    preconditions:
      - sh: '[ "$(git branch --show-current)" = "main" ]'
        msg: "Releases must run from main"
      - sh: '[ -z "$(git status --porcelain --untracked-files=all)" ]'
        msg: "The working tree must be clean before a release"
      - sh: git remote get-url origin
        msg: "The origin remote is required for a release"
    cmds:
      - task: bump
        vars:
          PART: "{{.PART}}"
      - cmd: task ci
      - cmd: "git add -- pyproject.toml CHANGELOG.md uv.lock"
      - cmd: 'git commit -m "Release v$({{.PYTHON_BIN}} -c "import re; from pathlib import Path; m=re.search(r''version\s*=\s*\"([\d.]+)\"'', Path(''pyproject.toml'').read_text()); print(m.group(1))")"'
      - task: tag

  release:dry-run:
    desc: "Show what a release would do without executing (usage: task release:dry-run -- patch)"
    vars:
      PART: "{{.CLI_ARGS}}"
    requires:
      vars:
        - name: PART
          enum: [major, minor, patch]
    cmds:
      - cmd: |
          NEXT=$({{.PYTHON_BIN}} {{.SCRIPT_DIR}}/build/bump_version.py {{.PART}} --next)
          echo "Would bump {{.PART}} to $NEXT"
          echo "Would verify the bumped source"
          echo "Would commit: Release v$NEXT"
          echo "Would tag: v$NEXT"
          echo "Would atomically push main and v$NEXT to origin"
        platforms: [linux, darwin]
