name: Medusa Release

on:
    push:
        tags:
            - 'v*.*.*'

env:
    ARTIFACT_NAME: medusa-thin.lua
    BUNDLED_ARTIFACT_NAME: medusa.lua
    BUILD_DIR: ./dist
    RELEASE_DIR: ./dist/release

permissions: {}

jobs:
    release-guard:
        name: Guard - Tag points to main
        runs-on: ubuntu-24.04
        permissions:
            contents: read
        outputs:
            on_main: ${{ steps.check.outputs.on_main }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
              with:
                  fetch-depth: 0
            - name: Determine if tag commit is on main
              id: check
              shell: bash
              run: |
                  git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
                  if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                    echo "on_main=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "on_main=false" >> "$GITHUB_OUTPUT"
                  fi

    validate:
        name: Validate release
        runs-on: ubuntu-24.04
        needs: release-guard
        if: needs.release-guard.outputs.on_main == 'true'
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
              with:
                  fetch-depth: 0

            - name: Setup Python
              uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5

            - name: Setup Task
              uses: arduino/setup-task@e26d8975574116b0097a1161e0fe16ba75d84c1c # v1.0.3
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Lua ${{ env.LUA_VERSION }}
              uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
              with:
                luaVersion: "5.1"

            - name: Verify tag matches pyproject.toml version
              env:
                REF_NAME: ${{ github.ref_name }}
              shell: bash
              run: |
                  set -e
                  TAG_VERSION="${REF_NAME#v}"
                  FILE_VERSION=$(python -c "
                  import re; from pathlib import Path
                  m = re.search(r'version\s*=\s*\"(\d+\.\d+\.\d+)\"', Path('pyproject.toml').read_text())
                  print(m.group(1) if m else '')
                  ")
                  if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
                    echo "::error::Tag version ($TAG_VERSION) does not match pyproject.toml ($FILE_VERSION)"
                    exit 1
                  fi
                  echo "Version match: $TAG_VERSION"

            - name: Verify changelog section is non-empty
              env:
                REF_NAME: ${{ github.ref_name }}
              shell: bash
              run: |
                  set -e
                  VERSION="${REF_NAME#v}"
                  SECTION=$(python -c "
                  import re; from pathlib import Path
                  content = Path('CHANGELOG.md').read_text()
                  version = '$VERSION'
                  pat = re.compile(rf'(?ms)^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)')
                  m = pat.search(content)
                  body = m.group(1).strip() if m else ''
                  has_entries = bool(re.search(r'^\s*[-*]', body, re.MULTILINE))
                  print('yes' if has_entries else 'no')
                  ")
                  if [ "$SECTION" != "yes" ]; then
                    echo "::error::CHANGELOG.md has no entries for version $VERSION"
                    exit 1
                  fi
                  echo "Changelog section for $VERSION is non-empty"

            - name: Format check
              run: task format:ci

            - name: Test
              run: task test

            - name: Build
              run: task build

            - name: Syntax check
              run: task syntax:check

            - name: Verify version stamped
              run: |
                if grep -q '{{VERSION}}' '${{ env.BUILD_DIR }}/${{ env.ARTIFACT_NAME }}'; then
                  echo "::error::{{VERSION}} placeholder found in ${{ env.ARTIFACT_NAME }}"
                  exit 1
                fi
                if grep -q '{{VERSION}}' '${{ env.BUILD_DIR }}/${{ env.BUNDLED_ARTIFACT_NAME }}'; then
                  echo "::error::{{VERSION}} placeholder found in ${{ env.BUNDLED_ARTIFACT_NAME }}"
                  exit 1
                fi

            - name: Lint thin
              uses: YoloWingPixie/selene-lua-linter-action@24ecf180fd5bb4d3b40b4296de61b32179cb79d1 # v1
              with:
                config-path: 'selene.toml'
                lint-path: '${{ env.BUILD_DIR }}/${{ env.ARTIFACT_NAME }}'
                report-as-annotations: 'true'
                selene-args: '--allow-warnings'
                working-directory: '.'

            - name: Lint bundled
              uses: YoloWingPixie/selene-lua-linter-action@24ecf180fd5bb4d3b40b4296de61b32179cb79d1 # v1
              with:
                config-path: 'selene-bundled.toml'
                lint-path: '${{ env.BUILD_DIR }}/${{ env.BUNDLED_ARTIFACT_NAME }}'
                report-as-annotations: 'true'
                selene-args: '--allow-warnings'
                working-directory: '.'

    release:
        name: Release on main tags only
        runs-on: ubuntu-24.04
        needs: validate
        permissions:
            contents: write
        steps:
            - name: Checkout
              id: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
              with:
                  fetch-depth: 0

            - name: Setup Python
              id: setup-python
              uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5

            - name: Setup Task
              id: setup-task
              uses: arduino/setup-task@e26d8975574116b0097a1161e0fe16ba75d84c1c # v1.0.3
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Prepare release artifacts
              id: package
              env:
                REF_NAME: ${{ github.ref_name }}
              run: |
                  task release:package
                  VERSION="${REF_NAME#v}"
                  echo "bundled=medusa-${VERSION}.lua" >> "$GITHUB_OUTPUT"
                  echo "thin=medusa-thin-${VERSION}.lua" >> "$GITHUB_OUTPUT"

            - name: Extract release notes
              id: notes
              env:
                REF_NAME: ${{ github.ref_name }}
              shell: bash
              run: |
                  python ./scripts/build/extract_changelog_section.py "$REF_NAME" CHANGELOG.md RELEASE_NOTES.md

            - name: Create Github Release
              uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
              with:
                name: 'Release ${{ github.ref_name }}'
                make_latest: true
                prerelease: false
                draft: false
                body_path: RELEASE_NOTES.md
                fail_on_unmatched_files: true
                files: |
                    ${{ env.RELEASE_DIR }}/${{ steps.package.outputs.bundled }}
                    ${{ env.RELEASE_DIR }}/${{ steps.package.outputs.thin }}
                    ${{ env.RELEASE_DIR }}/SHA256SUMS.txt
                    LICENSE

            - name: Upload to R2 (versioned)
              uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
              with:
                apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                command: |
                    r2 object put ${{ secrets.R2_BUCKET_NAME }}/releases/${{ github.ref_name }}/${{ steps.package.outputs.bundled }} --file=${{ env.RELEASE_DIR }}/${{ steps.package.outputs.bundled }} --content-type=text/plain --content-disposition='attachment; filename="${{ steps.package.outputs.bundled }}"'
                    r2 object put ${{ secrets.R2_BUCKET_NAME }}/releases/${{ github.ref_name }}/${{ steps.package.outputs.thin }} --file=${{ env.RELEASE_DIR }}/${{ steps.package.outputs.thin }} --content-type=text/plain --content-disposition='attachment; filename="${{ steps.package.outputs.thin }}"'
                    r2 object put ${{ secrets.R2_BUCKET_NAME }}/releases/${{ github.ref_name }}/SHA256SUMS.txt --file=${{ env.RELEASE_DIR }}/SHA256SUMS.txt

            - name: Upload to R2 (latest)
              uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
              with:
                apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                command: |
                    r2 object put ${{ secrets.R2_BUCKET_NAME }}/releases/latest/medusa.lua --file=${{ env.RELEASE_DIR }}/${{ steps.package.outputs.bundled }} --content-type=text/plain --content-disposition='attachment; filename="${{ steps.package.outputs.bundled }}"'
                    r2 object put ${{ secrets.R2_BUCKET_NAME }}/releases/latest/medusa-thin.lua --file=${{ env.RELEASE_DIR }}/${{ steps.package.outputs.thin }} --content-type=text/plain --content-disposition='attachment; filename="${{ steps.package.outputs.thin }}"'
                    r2 object put ${{ secrets.R2_BUCKET_NAME }}/releases/latest/SHA256SUMS.txt --file=${{ env.RELEASE_DIR }}/SHA256SUMS.txt
