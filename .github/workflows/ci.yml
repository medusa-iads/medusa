name: Medusa CI

on:
  push:
    branches:
      - main
    paths:
      - "**/*.lua"
      - "**/*.py"
      - "scripts/ci/**/*.js"
      - ".github/workflows/ci.yml"
      - ".buildrc"
      - "**/*.toml"
      - "**/.python-version"
      - "**/Taskfile.yml"
      - "tools/prometheus/**"
      - "uv.lock"
  pull_request:
    branches:
      - main
      - release/*
    paths:
      - "**/*.lua"
      - "**/*.py"
      - "scripts/ci/**/*.js"
      - ".github/workflows/ci.yml"
      - ".buildrc"
      - "**/*.toml"
      - "**/.python-version"
      - "**/Taskfile.yml"
      - "tools/prometheus/**"
      - "uv.lock"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LUA_VERSION: 5.1
  ARTIFACT_NAME: medusa-thin.lua
  BUNDLED_ARTIFACT_NAME: medusa.lua
  ARTIFACT_DIR: dist
  ARTIFACT_NAME_SHA: ci-artifact.lua

jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0

      - name: Setup uv
        id: setup-uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.12"
          enable-cache: false

      - name: Setup Task
        id: setup-task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Lua ${{ env.LUA_VERSION }}
        id: setup-lua
        uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
        with:
          luaVersion: "${{ env.LUA_VERSION }}"

      - name: Cache Lua toolchain
        id: cache-lua
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lua
          key: lua-${{ runner.os }}-${{ env.LUA_VERSION }}-ghactionslua-v10

      - name: Format
        id: format
        run: task format:ci

      - name: Test
        id: test
        run: task test

      - name: Lua complexity
        id: complexity
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          task complexity:check -- \
            --base-ref "$BASE_SHA" \
            --github-annotations \
            --markdown-report "$RUNNER_TEMP/lua-complexity.md" \
            --json-report "$RUNNER_TEMP/lua-complexity.json"

      - name: Observability checks
        id: o11y-check
        run: task o11y:check

      - name: Build
        id: build
        run: task build

      - name: Syntax check
        id: syntax-check
        run: task syntax:check

      - name: Verify version stamped
        id: version-stamp-check
        run: |
          if grep -q '{{VERSION}}' '${{ env.ARTIFACT_DIR }}/${{ env.ARTIFACT_NAME }}'; then
            echo "::error::{{VERSION}} placeholder found in ${{ env.ARTIFACT_NAME }}"
            exit 1
          fi
          if grep -q '{{VERSION}}' '${{ env.ARTIFACT_DIR }}/${{ env.BUNDLED_ARTIFACT_NAME }}'; then
            echo "::error::{{VERSION}} placeholder found in ${{ env.BUNDLED_ARTIFACT_NAME }}"
            exit 1
          fi

      - name: Lint thin
        id: lint-thin
        continue-on-error: true
        uses: YoloWingPixie/selene-lua-linter-action@24ecf180fd5bb4d3b40b4296de61b32179cb79d1 # v1
        with:
          config-path: "selene.toml"
          lint-path: "${{ env.ARTIFACT_DIR }}/${{ env.ARTIFACT_NAME }}"
          report-as-annotations: "false"
          selene-args: "--allow-warnings --display-style Json"
          working-directory: "."

      - name: Lint bundled
        id: lint-bundled
        continue-on-error: true
        uses: YoloWingPixie/selene-lua-linter-action@24ecf180fd5bb4d3b40b4296de61b32179cb79d1 # v1
        with:
          config-path: "selene-bundled.toml"
          lint-path: "${{ env.ARTIFACT_DIR }}/${{ env.BUNDLED_ARTIFACT_NAME }}"
          report-as-annotations: "false"
          selene-args: "--allow-warnings --display-style Json"
          working-directory: "."

      - name: Test CI PR comment
        id: ci-comment-test
        run: task ci:comment:test

      - name: Comment PR with results
        if: always() && github.event_name == 'pull_request'
        env:
          TEST_RESULT: ${{ steps.test.outcome }}
          COMPLEXITY_RESULT: ${{ steps.complexity.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          SYNTAX_RESULT: ${{ steps.syntax-check.outcome }}
          STAMP_RESULT: ${{ steps.version-stamp-check.outcome }}
          LINT_THIN_RESULT: ${{ steps.lint-thin.outcome }}
          LINT_BUNDLED_RESULT: ${{ steps.lint-bundled.outcome }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const commentPrResults = require('./scripts/ci/comment_pr_results.js');
            await commentPrResults({ github, context, env: process.env });

      - name: Compute artifact names
        id: compute-artifact-name
        run: |
          set -e
          SAFE_REF_NAME="${GITHUB_REF_NAME//\//-}"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "SAFE_REF_NAME=${SAFE_REF_NAME}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME_SHA=medusa-thin.lua-${SAFE_REF_NAME}-${GITHUB_RUN_ID}-${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "BUNDLED_ARTIFACT_NAME_SHA=medusa.lua-${SAFE_REF_NAME}-${GITHUB_RUN_ID}-${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Rename build artifacts with SHA
        id: rename
        run: |
          set -e
          mv '${{ env.ARTIFACT_DIR }}/${{ env.ARTIFACT_NAME }}' '${{ env.ARTIFACT_DIR }}/${{ env.ARTIFACT_NAME_SHA }}'
          mv '${{ env.ARTIFACT_DIR }}/${{ env.BUNDLED_ARTIFACT_NAME }}' '${{ env.ARTIFACT_DIR }}/${{ env.BUNDLED_ARTIFACT_NAME_SHA }}'

      - name: Upload thin artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload-thin
        with:
          name: "${{ env.ARTIFACT_NAME_SHA }}"
          path: "${{ env.ARTIFACT_DIR }}/${{ env.ARTIFACT_NAME_SHA }}"
          retention-days: 14

      - name: Upload bundled artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload-bundled
        with:
          name: "${{ env.BUNDLED_ARTIFACT_NAME_SHA }}"
          path: "${{ env.ARTIFACT_DIR }}/${{ env.BUNDLED_ARTIFACT_NAME_SHA }}"
          retention-days: 14

      - name: Log artifact digests
        run: |
          echo "### Artifact Digests" >> "$GITHUB_STEP_SUMMARY"
          echo "- thin: \`${{ steps.upload-thin.outputs.artifact-digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- bundled: \`${{ steps.upload-bundled.outputs.artifact-digest }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if critical checks failed
        run: |
          if [ "${{ steps.test.outcome }}" != "success" ] || \
             [ "${{ steps.build.outcome }}" != "success" ] || \
             [ "${{ steps.syntax-check.outcome }}" != "success" ] || \
             [ "${{ steps.version-stamp-check.outcome }}" != "success" ] || \
             [ "${{ steps.lint-thin.outcome }}" != "success" ] || \
             [ "${{ steps.lint-bundled.outcome }}" != "success" ]; then
            echo "::error::Critical checks failed"
            exit 1
          fi
