name: PR Runtime Lua LOC

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report:
    name: Comment runtime Lua LOC
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPOSITORY: ${{ github.repository }}
      TRUSTED_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Fetch trusted base and pull request data
        shell: bash
        run: |
          set -euo pipefail
          case "$PR_NUMBER" in
            ""|*[!0-9]*)
              echo "Invalid pull request number"
              exit 1
              ;;
          esac
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${REPOSITORY}.git"
          git fetch --no-tags origin "$TRUSTED_SHA"
          git checkout --detach "$TRUSTED_SHA"
          git fetch --no-tags origin "$BASE_SHA"
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
          FETCHED_HEAD="$(git rev-parse FETCH_HEAD)"
          if [ "$FETCHED_HEAD" != "$HEAD_SHA" ]; then
            echo "Pull request changed while this workflow was starting"
            exit 1
          fi

      - name: Render runtime Lua LOC report
        shell: bash
        run: python scripts/ci/runtime_lua_loc.py --base-ref "$BASE_SHA" --head-ref "$HEAD_SHA" > "${RUNNER_TEMP}/runtime-lua-loc.md"

      - name: Create or update pull request comment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          COMMENT_ID="$(
            gh api --paginate "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
              --jq '.[] | select(.user.type == "Bot" and (.body | contains("<!-- medusa-runtime-lua-loc -->"))) | .id' \
              | sed -n '1p'
          )"
          REPORT_PATH="${RUNNER_TEMP}/runtime-lua-loc.md"
          BODY_JSON="${RUNNER_TEMP}/runtime-lua-loc.json"
          jq --null-input --rawfile body "$REPORT_PATH" '{body: $body}' > "$BODY_JSON"
          if [ -n "$COMMENT_ID" ]; then
            case "$COMMENT_ID" in
              *[!0-9]*)
                echo "Invalid comment identifier"
                exit 1
                ;;
            esac
            gh api --method PATCH "repos/${REPOSITORY}/issues/comments/${COMMENT_ID}" --input "$BODY_JSON" >/dev/null
          else
            gh api --method POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" --input "$BODY_JSON" >/dev/null
          fi
